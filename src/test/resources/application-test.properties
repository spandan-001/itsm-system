# Tests always use a private in-memory H2 database, whatever the main config points at.
spring.datasource.url=jdbc:h2:mem:itsm-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Tests trigger these explicitly instead of waiting for the schedulers.
itsm.sla.initial-delay-ms=3600000
itsm.routing.initial-delay-ms=3600000
itsm.seed.demo-data=false
